[project]
name = "ai-architect-chapter4-examples"
version = "0.1.0"
description = "Runnable production-oriented examples for Chapter 4 of the AI Architect handbook"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.15.0,<3",
    "pydantic>=2.0,<3",
]

[tool.uv]
package = false

[tool.pyright]
include = ["python"]

[tool.ruff]
line-length = 100
